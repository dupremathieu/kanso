name: Release

# Tag-driven release: only this workflow runs for v* tags (ci.yml ignores tags).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialise releases so two tags cannot race on :latest.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  musl:
    name: musl binary
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: Build static binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Name the release asset
        run: cp target/x86_64-unknown-linux-musl/release/kanso kanso-x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: kanso-x86_64-unknown-linux-musl
          path: kanso-x86_64-unknown-linux-musl
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked
      - name: Generate SBOMs
        run: ./scripts/sbom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kanso-sbom
          path: dist/sbom/*.cdx.json
          if-no-files-found: error

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/dupremathieu/kanso:${{ github.ref_name }}
            ghcr.io/dupremathieu/kanso:latest

  release:
    name: GitHub release
    needs: [musl, image, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kanso-x86_64-unknown-linux-musl
      - uses: actions/download-artifact@v4
        with:
          name: kanso-sbom
          path: sbom
      - name: Restore the executable bit
        run: chmod +x kanso-x86_64-unknown-linux-musl
      - name: Attach the musl binary and SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets="kanso-x86_64-unknown-linux-musl sbom/kanso-backend.cdx.json sbom/kanso-frontend.cdx.json"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $assets
          fi
